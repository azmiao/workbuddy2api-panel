name: docker-ghcr

# 多架构镜像（amd64/arm64）自动构建并发布到 ghcr.io：
#   - 任意分支或 tag 的 push → 构建并推送
#   - 手动触发 → 默认构建并推送，也可选择仅编译验证
#   - PR 触碰构建相关文件 → 仅构建验证，不推送
# tag 说明：默认分支推 latest + 分支名 + sha-xxxxxx；其他分支推分支名 + sha-xxxxxx；v1.2.3 推 1.2.3 / 1.2 / 1
# GHCR 的 latest 在构建完成后再次发布，确保包页面默认安装命令使用 latest
on:
  # 不配置 branches/tags，任意分支和 tag 的 push 都会触发
  push: {}
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
      - "*.sh"
      - "config.example.json"
      - ".github/workflows/docker-ghcr.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: 发布镜像到 GHCR（关闭则仅编译验证）
        required: true
        default: true
        type: boolean

# 并发组：PR 取消过时构建；每个引用按序构建，避免连续 push 重复并发
# 同一份代码的多架构构建（QEMU arm64 一次不便宜）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # github.repository 自动小写化，镜像始终发布到当前 fork 对应的 GHCR 命名空间
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（arm64 交叉模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关闭 provenance attestation：避免 ghcr 页面出现 unknown/unknown 架构条目
          provenance: false

      # 参考 muse2api：把 latest 作为最后一次 registry 写入，避免 GHCR 页面选中 sha 标签。
      - name: Re-publish latest last
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          short_sha="${GITHUB_SHA:0:7}"
          docker buildx imagetools create \
            --tag "${image}:latest" \
            "${image}:sha-${short_sha}"
          docker buildx imagetools inspect "${image}:latest"
